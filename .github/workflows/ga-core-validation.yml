name: GA Core Theme Validation

on:
  push:
    branches:
      - site-core-modernization-v2
    paths:
      - 'site-core/**'
      - '.github/workflows/ga-core-validation.yml'
      - 'packages/**'
  pull_request:
    paths:
      - 'site-core/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          find site-core/garibalde-institucional -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: node --check site-core/garibalde-institucional/assets/site.js
      - name: Validate n8n workflow JSON and embedded code
        run: |
          python - <<'PY'
          import json, pathlib
          for path in pathlib.Path('site-core/n8n').glob('*.json'):
              data = json.loads(path.read_text(encoding='utf-8'))
              assert data.get('nodes'), f'{path}: missing nodes'
              assert data.get('connections') is not None, f'{path}: missing connections'
              for node in data['nodes']:
                  if node.get('type') == 'n8n-nodes-base.code':
                      assert isinstance(node.get('parameters', {}).get('jsCode'), str), f'{path}: {node.get("name")} missing jsCode'
              print(f'JSON OK: {path}')
          PY
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          for (const file of fs.readdirSync('site-core/n8n').filter(f => f.endsWith('.json'))) {
            const workflow = JSON.parse(fs.readFileSync(path.join('site-core/n8n', file), 'utf8'));
            for (const node of workflow.nodes || []) {
              if (node.type === 'n8n-nodes-base.code') {
                try { new Function(node.parameters.jsCode); }
                catch (error) { console.error(file + ' / ' + node.name + ': ' + error.message); process.exit(1); }
                console.log('Embedded JS OK: ' + file + ' / ' + node.name);
              }
            }
          }
          NODE
      - name: Validate canonical photo manifest
        run: |
          python site-core/tools/test-photo-manifest.py
          python -m py_compile site-core/tools/prepare-home-slides.py site-core/tools/generate-photo-masters.py site-core/tools/test-photo-manifest.py
      - name: Check theme minimum files
        run: |
          test -s site-core/garibalde-institucional/style.css
          test -s site-core/garibalde-institucional/functions.php
          test -s site-core/garibalde-institucional/index.php
      - name: Build clean homepage slides from prepared source images
        run: |
          python -m pip install --disable-pip-version-check Pillow
          python site-core/tools/prepare-home-slides.py
          test -s site-core/garibalde-institucional/assets/images/home-preview/slide-1-preview.webp
          test -s site-core/garibalde-institucional/assets/images/home-preview/slide-2-preview.webp
          test -s site-core/garibalde-institucional/assets/images/home-preview/slide-3-preview.webp
      - name: Check canonical photo mapping logic
        run: |
          grep -q 'function ga_core_primary_page_slides' site-core/garibalde-institucional/inc/areas.php
          grep -q 'function ga_core_get_area_images' site-core/garibalde-institucional/inc/areas.php
          grep -q 'DIREITO_TRIBUTARIO-01.webp' site-core/garibalde-institucional/inc/areas.php
          grep -q 'RELACAO_DE_CONSUMO-05.webp' site-core/garibalde-institucional/inc/areas.php
          test -s site-core/garibalde-institucional/single-ga_area_atuacao.php
          test -s site-core/garibalde-institucional/page-area-de-atuacao.php
      - name: Package theme ZIP
        run: |
          cd site-core
          zip -r garibalde-institucional-2.0.0.zip garibalde-institucional
          unzip -t garibalde-institucional-2.0.0.zip
      - name: Upload theme artifact
        uses: actions/upload-artifact@v4
        with:
          name: garibalde-institucional-2.0.0
          path: site-core/garibalde-institucional-2.0.0.zip
          if-no-files-found: error
          retention-days: 30
